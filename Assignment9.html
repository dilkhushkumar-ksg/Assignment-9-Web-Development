<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 9 | Web Programming</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            /* font-family: 'Courier New', Courier, monospace; */
        }
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            letter-spacing: 8px;
        }
        .container {
            height: 80%;
            width: 90%;
            background-color: teal;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box {
            height: 80%;
            width: 90%;
            background-color: skyblue;
            position: relative;
        }
        .margin {
            color: white;
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
        }
        .border {
            color: white;
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
        }
        .padding {
            color: white;
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
        }
        .box1 {
            height: 80%;
            width: 90%;
            background-color: blue;
            border: 40px solid rgb(47, 47, 161);
            position: relative;

            margin: 50px 57px 50px 57px;
            padding: 70px 70px 70px 70px;
        }
        .box2 {
            height: 100%;
            width: 100%;
            background-color: orange;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 20px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>BOX PLOTTING</h1>
    <div class="container">
        <div class="box">
            <p class="margin">MARGIN</p>
            <div class="box1">
                <p class="border">BORDER</p>
                <div class="box2">
                    <p class="padding">PADDING</p>
                    <p>CONTENT</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
